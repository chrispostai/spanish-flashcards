<!DOCTYPE html>

<html lang="en">

<head>

      <meta charset="UTF-8">

      <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

      <title>Spanish Flashcards</title>

      <meta name="apple-mobile-web-app-capable" content="yes">

      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

      <style>

            :root {

                  --bg-color: #f2f2f7;

                  --card-bg: #ffffff;

                  --text-color: #1c1c1e;

                  --subtext-color: #8e8e93;

                  --easy-color: #34c759;

                  --good-color: #ff9500;

                  --hard-color: #ff3b30;

                  --accent-color: #007aff;

            }

            body {

                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

                  background-color: var(--bg-color);

                  color: var(--text-color);

                  margin: 0;

                  display: flex;

                  flex-direction: column;

                  height: 100vh;

                  justify-content: space-between;

                  align-items: center;

                  user-select: none;

                  -webkit-user-select: none;

            }

            header { margin-top: 40px; text-align: center; width: 90%; }

            .stats { font-size: 13px; color: var(--subtext-color); margin-top: 6px; }

            .mode-selector { margin-top: 10px; display: flex; justify-content: center; gap: 6px; }

            .mode-btn { padding: 6px 12px; font-size: 12px; border-radius: 14px; border: 1px solid var(--accent-color); background: transparent; color: var(--accent-color); font-weight: 600; }

            .mode-btn.active { background: var(--accent-color); color: white; }

            .card-container { width: 85%; max-width: 350px; height: 240px; perspective: 1000px; cursor: pointer; }

            .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s ease; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border-radius: 20px; background-color: var(--card-bg); }

            .card.flipped { transform: rotateY(180deg); }

            .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 20px; padding: 20px; box-sizing: border-box; }

            .card-back { transform: rotateY(180deg); background-color: #fafafa; }

            .word { font-size: 32px; font-weight: 700; text-align: center; }

            .lang-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--subtext-color); margin-bottom: 8px; }

            .hint { font-size: 13px; color: var(--subtext-color); margin-top: 15px; }

            .controls { width: 85%; max-width: 350px; margin-bottom: 35px; display: flex; gap: 10px; min-height: 50px; }

            button.rate-btn { flex: 1; padding: 15px 0; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; color: white; cursor: pointer; }

            .btn-hard { background-color: var(--hard-color); }

            .btn-good { background-color: var(--good-color); }

            .btn-easy { background-color: var(--easy-color); }

            .hidden { display: none !important; }

      </style>

</head>

<body>

      <header>

            <h3 style="margin:0;">Spanish Flashcards</h3>

            <div class="mode-selector">

                  <button class="mode-btn active" id="mode-es-en" onclick="setMode('es-en')">ES ➔ EN</button>

                  <button class="mode-btn" id="mode-en-es" onclick="setMode('en-es')">EN ➔ ES</button>

                  <button class="mode-btn" id="mode-mix" onclick="setMode('mix')">Mixed</button>

            </div>

            <div class="stats" id="stats">Due: 0 | Studied: 0</div>

      </header>

      <div class="card-container" onclick="flipCard()">

            <div class="card" id="card">

                  <div class="card-face card-front">

                        <div class="lang-label" id="front-label">SPANISH</div>

                        <div class="word" id="front-word">...</div>

                        <div class="hint">Tap to reveal answer</div>

                  </div>

                  <div class="card-face card-back">

                        <div class="lang-label" id="back-label">ENGLISH</div>

                        <div class="word" id="back-word">...</div>

                  </div>

            </div>

      </div>

      <div class="controls" id="controls">

            <button class="rate-btn btn-hard" onclick="rateCard('hard')">Hard</button>

            <button class="rate-btn btn-good" onclick="rateCard('good')">Good</button>

            <button class="rate-btn btn-easy" onclick="rateCard('easy')">Easy</button>

      </div>

      <script>

            // Progress storage and logic

            const initialWords = [
                  { id: 'hola', es: 'hola', en: 'hello' },
                  { id: 'adios', es: 'adiós', en: 'goodbye' },
                  { id: 'gracias', es: 'gracias', en: 'thank you' },
                  { id: 'por-favor', es: 'por favor', en: 'please' },
                  { id: 'si', es: 'sí', en: 'yes' },
                  { id: 'no', es: 'no', en: 'no' },
                  { id: 'agua', es: 'agua', en: 'water' },
                  { id: 'comida', es: 'comida', en: 'food' },
                  { id: 'casa', es: 'casa', en: 'house' },
                  { id: 'amigo', es: 'amigo', en: 'friend' },
                  { id: 'familia', es: 'familia', en: 'family' },
                  { id: 'dia', es: 'día', en: 'day' },
                  { id: 'noche', es: 'noche', en: 'night' },
                  { id: 'bueno', es: 'bueno', en: 'good' },
                  { id: 'grande', es: 'grande', en: 'big' },
                  { id: 'pequeno', es: 'pequeño', en: 'small' },
                  { id: 'hablar', es: 'hablar', en: 'to speak' },
                  { id: 'comer', es: 'comer', en: 'to eat' },
                  { id: 'vivir', es: 'vivir', en: 'to live' },
                  { id: 'aprender', es: 'aprender', en: 'to learn' }
            ];

            let progress = JSON.parse(localStorage.getItem('spanish_srs_progress')) || {};

            let studyMode = localStorage.getItem('spanish_study_mode') || 'es-en';

            let currentCard = null;

            let isFlipped = false;

            function setMode(mode) {

                  studyMode = mode;

                  localStorage.setItem('spanish_study_mode', mode);

                  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));

                  document.getElementById(`mode-${mode}`).classList.add('active');

                  loadNextCard();

            }

            function getCardData(word) {

                  if (!progress[word.id]) {

                        progress[word.id] = { interval: 1, easeFactor: 2.5, dueDate: Date.now(), reviews: 0 };

                  }

                  return progress[word.id];

            }

            function getDueCards() {

                  const now = Date.now();

                  return initialWords.filter(w => getCardData(w).dueDate <= now);

            }

            function saveProgress() {

                  localStorage.setItem('spanish_srs_progress', JSON.stringify(progress));

            }

            function updateStats() {

                  const dueCount = getDueCards().length;

                  const studiedCount = Object.keys(progress).filter(id => progress[id].reviews > 0).length;

                  document.getElementById('stats').innerText = `Due: ${dueCount} | Studied: ${studiedCount} / ${initialWords.length}`;

            }

            function loadNextCard() {

                  const due = getDueCards();

                  updateStats();

                  if (due.length === 0) {

                        document.getElementById('front-label').innerText = "SUCCESS";

                        document.getElementById('front-word').innerText = "All caught up! 🎉";

                        document.getElementById('back-label').innerText = "SEE YOU TOMORROW";

                        document.getElementById('back-word').innerText = "Check back later!";

                        document.getElementById('controls').classList.add('hidden');

                        currentCard = null;

                        return;

                  }

                  document.getElementById('controls').classList.remove('hidden');

                  currentCard = due[0];

                  let dir = studyMode;

                  if (studyMode === 'mix') dir = Math.random() > 0.5 ? 'es-en' : 'en-es';

                  if (dir === 'es-en') {

                        document.getElementById('front-label').innerText = "SPANISH";

                        document.getElementById('front-word').innerText = currentCard.es;

                        document.getElementById('back-label').innerText = "ENGLISH";

                        document.getElementById('back-word').innerText = currentCard.en;

                  } else {

                        document.getElementById('front-label').innerText = "ENGLISH";

                        document.getElementById('front-word').innerText = currentCard.en;

                        document.getElementById('back-label').innerText = "SPANISH";

                        document.getElementById('back-word').innerText = currentCard.es;

                  }

                  isFlipped = false;

                  document.getElementById('card').classList.remove('flipped');

            }

            function flipCard() {

                  if (!currentCard) return;

                  isFlipped = !isFlipped;

                  document.getElementById('card').classList.toggle('flipped', isFlipped);

            }

            function rateCard(rating) {

                  if (!currentCard) return;

                  const p = getCardData(currentCard);

                  const dayMs = 24 * 60 * 60 * 1000;

                  if (rating === 'hard') {

                        p.interval = 1;

                        p.easeFactor = Math.max(1.3, p.easeFactor - 0.2);

                  } else if (rating === 'good') {

                        p.interval = Math.round(p.interval * p.easeFactor);

                  } else if (rating === 'easy') {

                        p.easeFactor += 0.15;

                        p.interval = Math.round(p.interval * p.easeFactor * 1.3);

                  }

                  p.dueDate = Date.now() + (p.interval * dayMs);

                  p.reviews += 1;

                  saveProgress();

                  loadNextCard();

            }

            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`mode-${studyMode}`).classList.add('active');

            loadNextCard();

      </script>

</body>

</html>
