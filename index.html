<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <title>Spanish Flashcards</title>
  <style>
    :root{--bg:#f2f2f7;--text:#1c1c1e;--muted:#75757b;--blue:#0877d1;--red:#d62f28;--amber:#c76b00;--green:#248a3d}
    *{box-sizing:border-box}body{min-height:100vh;min-height:100dvh;margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;justify-content:space-between;align-items:center;overflow:hidden;font-family:ui-rounded,"Avenir Next",Avenir,sans-serif;color:var(--text);background:radial-gradient(circle at 18% 10%,#fff 0,transparent 30%),var(--bg);user-select:none;-webkit-user-select:none}
    header{margin-top:34px;text-align:center;width:90%}h1{margin:0;font-size:22px;letter-spacing:-.4px}.stats{font-size:13px;color:var(--muted);margin-top:9px}.modes{margin-top:14px;display:flex;justify-content:center;gap:6px}button{font:inherit;cursor:pointer}.mode{padding:7px 12px;font-size:12px;border-radius:999px;border:1px solid var(--blue);background:transparent;color:var(--blue);font-weight:700}.mode.active{background:var(--blue);color:#fff}
    .stage{width:85%;max-width:350px;height:240px;perspective:1000px;cursor:pointer}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s ease;box-shadow:0 14px 38px #1c1c1e1c;border-radius:22px;background:#fff}.card.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;border-radius:22px;padding:20px}.back{transform:rotateY(180deg);background:#fafafa}.word{font-size:clamp(28px,9vw,38px);font-weight:750;text-align:center}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted);margin-bottom:9px}.hint{font-size:13px;color:var(--muted);margin-top:16px}
    .controls{width:85%;max-width:350px;margin-bottom:28px;display:flex;gap:10px;min-height:50px}.rate{flex:1;padding:15px 0;border:0;border-radius:13px;font-size:15px;font-weight:750;color:#fff;box-shadow:0 4px 10px #1c1c1e1f}.rate:active{transform:translateY(1px);box-shadow:none}.hard{background:var(--red)}.good{background:var(--amber)}.easy{background:var(--green)}.hidden{visibility:hidden;pointer-events:none}button:focus-visible,.stage:focus-visible{outline:3px solid #0877d173;outline-offset:3px}@media(prefers-reduced-motion:reduce){.card{transition:none}}
  </style>
</head>
<body>
  <header><h1>Spanish Flashcards</h1><div class="modes" aria-label="Study direction"><button class="mode active" data-mode="es-en">ES → EN</button><button class="mode" data-mode="en-es">EN → ES</button><button class="mode" data-mode="mix">Mixed</button></div><div class="stats" id="stats" aria-live="polite"></div></header>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Flip flashcard"><div class="card" id="card"><div class="face"><div class="label" id="frontLabel">Spanish</div><div class="word" id="frontWord">…</div><div class="hint">Tap to reveal answer</div></div><div class="face back"><div class="label" id="backLabel">English</div><div class="word" id="backWord">…</div></div></div></div>
  <div class="controls" id="controls"><button class="rate hard" data-rating="hard">Hard</button><button class="rate good" data-rating="good">Good</button><button class="rate easy" data-rating="easy">Easy</button></div>
  <script>
    const words=[['hola','hello'],['gracias','thank you'],['por favor','please'],['adiós','goodbye'],['agua','water'],['comida','food'],['casa','house'],['amigo','friend'],['familia','family'],['trabajo','work'],['tiempo','time'],['hoy','today'],['mañana','tomorrow'],['bueno','good'],['feliz','happy']].map(([es,en],id)=>({id:String(id),es,en}));
    const byId=id=>document.getElementById(id);
    function savedProgress(){try{return JSON.parse(localStorage.getItem('spanish_srs_progress'))||{}}catch{return{}}}
    let progress=savedProgress(),mode=localStorage.getItem('spanish_study_mode')||'es-en',current=null,flipped=false;
    if(!['es-en','en-es','mix'].includes(mode))mode='es-en';
    function data(word){return progress[word.id]??=( {interval:1,ease:2.5,due:Date.now(),reviews:0} )}
    function due(){const now=Date.now();return words.filter(word=>data(word).due<=now)}
    function stats(){const studied=words.filter(word=>progress[word.id]?.reviews>0).length;byId('stats').textContent=`Due: ${due().length} | Studied: ${studied} / ${words.length}`}
    function showNext(){const queue=due();stats();flipped=false;byId('card').classList.remove('flipped');if(!queue.length){current=null;byId('frontLabel').textContent='Complete';byId('frontWord').textContent='All caught up';byId('backLabel').textContent='Come back later';byId('backWord').textContent='¡Buen trabajo!';byId('controls').classList.add('hidden');return}byId('controls').classList.remove('hidden');current=queue[0];const spanish=(mode==='mix'?Math.random()>.5?'es-en':'en-es':mode)==='es-en';byId('frontLabel').textContent=spanish?'Spanish':'English';byId('frontWord').textContent=spanish?current.es:current.en;byId('backLabel').textContent=spanish?'English':'Spanish';byId('backWord').textContent=spanish?current.en:current.es}
    function setMode(next){mode=next;localStorage.setItem('spanish_study_mode',mode);document.querySelectorAll('.mode').forEach(button=>button.classList.toggle('active',button.dataset.mode===mode));showNext()}
    function flip(){if(!current)return;flipped=!flipped;byId('card').classList.toggle('flipped',flipped)}
    function rate(rating){if(!current)return;const p=data(current);if(rating==='hard'){p.interval=1;p.ease=Math.max(1.3,p.ease-.2)}else if(rating==='good')p.interval=Math.max(1,Math.round(p.interval*p.ease));else{p.ease+=.15;p.interval=Math.max(1,Math.round(p.interval*p.ease*1.3))}p.due=Date.now()+p.interval*86400000;p.reviews++;localStorage.setItem('spanish_srs_progress',JSON.stringify(progress));showNext()}
    document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));document.querySelectorAll('.rate').forEach(button=>button.addEventListener('click',()=>rate(button.dataset.rating)));byId('stage').addEventListener('click',flip);byId('stage').addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();flip()}});setMode(mode);
  </script>
</body>
</html>
